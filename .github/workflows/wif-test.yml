name: Test Claude API sign-in

# Run by hand (Actions → Test Claude API sign-in → Run workflow) to check keyless
# sign-in (Workload Identity Federation). It runs in the github-pages
# environment, like the daily update, so GitHub's identity token has the same
# subject the federation rule matches. Prints the exchange result with tokens
# redacted, then makes one tiny API call through the SDK.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  sign-in:
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GitHub identity token
        run: |
          curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$RUNNER_TEMP/gha-jwt"
          # Show the claims the federation rule matches (not the token itself).
          cut -d. -f2 "$RUNNER_TEMP/gha-jwt" | tr '_-' '/+' | base64 -d 2>/dev/null \
            | jq '{iss, sub, aud, repository_owner, ref, environment}' || true

      - name: Exchange it for an Anthropic access token
        run: |
          jq -n --rawfile jwt "$RUNNER_TEMP/gha-jwt" '{
            grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer",
            assertion: ($jwt | rtrimstr("\n")),
            federation_rule_id: env.ANTHROPIC_FEDERATION_RULE_ID,
            organization_id: env.ANTHROPIC_ORGANIZATION_ID,
            service_account_id: env.ANTHROPIC_SERVICE_ACCOUNT_ID,
            workspace_id: env.ANTHROPIC_WORKSPACE_ID
          }' | curl -sS https://api.anthropic.com/v1/oauth/token -H "content-type: application/json" --data @- \
             | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'

      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen

      - name: Call Claude through the SDK, as the tracker does
        env:
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/gha-jwt
        run: |
          uv run python - <<'EOF'
          import anthropic
          client = anthropic.Anthropic()
          r = client.messages.create(model="claude-opus-5-5", max_tokens=200,
                                     output_config={"effort": "low"},
                                     messages=[{"role": "user", "content": "Reply with the single word: connected"}])
          print("Model:", r.model, "| reply:", next((b.text for b in r.content if b.type == "text"), "").strip())
          print("Keyless sign-in works.")
          EOF
