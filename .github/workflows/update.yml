name: Daily update

# Checks the Legislature and the City Council for new home rule petitions and
# changes to existing ones, records what changed, and republishes the site.

on:
  schedule:
    - cron: "0 11 * * *" # every day, 6-7 AM in Boston
  workflow_dispatch:

permissions:
  contents: write # commit newly generated summaries back to the repo
  pages: write
  id-token: write
  issues: write # notifications are posted as issues, which GitHub emails to the owner

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # Closed sessions never change, so cached API responses make daily runs take minutes, not half an hour.
      - name: Restore API cache
        uses: actions/cache@v4
        with:
          path: cache
          key: api-cache-${{ github.run_id }}
          restore-keys: api-cache-

      - name: Download the last published data
        run: |
          mkdir -p output
          site="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          curl -fsSL "$site/boston.json" -o output/boston.json || rm -f output/boston.json
          curl -fsSL "$site/changelog.json" -o output/changelog.json || rm -f output/changelog.json

      - run: uv sync --frozen

      # Claude API sign-in. Preferred: Workload Identity Federation, with no stored key. GitHub issues this job
      # an identity token, and the Anthropic SDK exchanges it for a short-lived access token. It's on when the
      # ANTHROPIC_* repository variables below are set. Otherwise the ANTHROPIC_API_KEY secret is used, and
      # with neither, summaries fall back to the Legislature's own descriptions.
      - name: Fetch GitHub identity token for the Claude API
        if: vars.ANTHROPIC_FEDERATION_RULE_ID != ''
        run: |
          curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$RUNNER_TEMP/gha-jwt"

      - name: Run tracker
        run: |
          # Empty variables would still count as "set" to the SDK, so remove the ones that are blank.
          for v in ANTHROPIC_FEDERATION_RULE_ID ANTHROPIC_ORGANIZATION_ID ANTHROPIC_SERVICE_ACCOUNT_ID ANTHROPIC_WORKSPACE_ID ANTHROPIC_API_KEY; do
            [ -n "${!v}" ] || unset "$v"
          done
          if [ -n "$ANTHROPIC_FEDERATION_RULE_ID" ]; then
            # An API key outranks federation in the SDK, so drop it.
            unset ANTHROPIC_API_KEY
            export ANTHROPIC_IDENTITY_TOKEN_FILE="$RUNNER_TEMP/gha-jwt"
            # Anthropic access tokens last 10 minutes and each GitHub identity token can be exchanged once,
            # so keep a fresh identity token in the file; the SDK re-reads it when it renews.
            ( while sleep 240; do
                curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                  "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
                  | jq -r .value > "$RUNNER_TEMP/gha-jwt.new" && mv "$RUNNER_TEMP/gha-jwt.new" "$RUNNER_TEMP/gha-jwt"
              done ) &
            echo "Claude API: keyless sign-in (Workload Identity Federation)"
          elif [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "Claude API: API key secret"
          else
            unset ANTHROPIC_API_KEY
            echo "Claude API: no credentials; summaries use the Legislature's descriptions"
          fi
          uv run tracker.py
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          NOTIFY_MENTION: "@${{ github.repository_owner }}"

      - name: Save new summaries
        run: |
          if [ -f data/summaries.json ] && [ -n "$(git status --porcelain data/summaries.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/summaries.json
            git commit -m "Update petition summaries"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - id: deploy
        uses: actions/deploy-pages@v4

      # After a successful deploy: the next run compares against the published data, so posting
      # before deploying could email the same changes twice if the deploy failed.
      - name: Send notifications
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m hrt.post output/notifications.json
